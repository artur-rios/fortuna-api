name: Native Core

# The native core's Windows build, which stays on GitHub Actions: Jenkins runs the Linux checks (native-msrv and
# native-build in yggdrasil.yml, from ci/). It runs only when something the native core is built from changes, so
# it is waited for when it runs and never required. build.rs generates the operation table and the C header from
# docs/openapi/fortuna.json, so the contract is an input too.
on:
  push:
    branches: [develop, main, 'release/*']
    paths:
      - 'native/**'
      - 'docs/openapi/fortuna.json'
      - '.github/workflows/native-core.yml'
  pull_request:
    paths:
      - 'native/**'
      - 'docs/openapi/fortuna.json'
      - '.github/workflows/native-core.yml'

permissions:
  contents: read

concurrency:
  group: native-core-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to the commit of the release named in the trailing comment;
# Renovate (renovate.json) proposes the updates. dtolnay/rust-toolchain is pinned to a
# commit of its `stable` branch, so the toolchain is passed explicitly.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: fortuna-native-windows-x64
            library: native/fortuna-core/target/release/fortuna_core.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: native/fortuna-core
      - name: Check formatting
        run: cargo fmt --manifest-path native/fortuna-core/Cargo.toml -- --check
      - name: Lint native core
        run: cargo clippy --manifest-path native/fortuna-core/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test native boundary
        run: cargo test --manifest-path native/fortuna-core/Cargo.toml --locked
      - name: Build native library
        run: cargo build --manifest-path native/fortuna-core/Cargo.toml --release --locked
      - name: Upload native package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.library }}
            native/fortuna-core/include/fortuna_core.h
          if-no-files-found: error

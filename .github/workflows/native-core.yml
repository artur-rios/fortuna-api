name: Native Core

# Runs only when something the native core is built from changes. build.rs generates the operation
# table and the C header from docs/openapi/fortuna.json, so the contract is an input too.
on:
  push:
    branches: [main, develop]
    paths:
      - 'native/**'
      - 'docs/openapi/fortuna.json'
      - '.github/workflows/native-core.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'native/**'
      - 'docs/openapi/fortuna.json'
      - '.github/workflows/native-core.yml'

permissions:
  contents: read

concurrency:
  group: native-core-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned to the commit of the release named in the trailing comment;
# Dependabot (.github/dependabot.yml) proposes the updates. dtolnay/rust-toolchain is pinned to a
# commit of its `stable` branch, so the toolchain is passed explicitly.
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # rustsec/audit-check reports its findings as a check run.
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: native/fortuna-core

  msrv:
    name: msrv (rust-version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read rust-version from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' native/fortuna-core/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native/fortuna-core
          key: msrv
      - name: Test on the declared minimum supported Rust version
        run: cargo test --manifest-path native/fortuna-core/Cargo.toml --locked

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: fortuna-native-linux-x64
            library: native/fortuna-core/target/release/libfortuna_core.so
          - os: windows-latest
            artifact: fortuna-native-windows-x64
            library: native/fortuna-core/target/release/fortuna_core.dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native/fortuna-core
      - name: Check formatting
        run: cargo fmt --manifest-path native/fortuna-core/Cargo.toml -- --check
      - name: Lint native core
        run: cargo clippy --manifest-path native/fortuna-core/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test native boundary
        run: cargo test --manifest-path native/fortuna-core/Cargo.toml --locked
      - name: Build native library
        run: cargo build --manifest-path native/fortuna-core/Cargo.toml --release --locked
      - name: Check generated header
        if: runner.os == 'Linux'
        run: git diff --exit-code -- native/fortuna-core/include/fortuna_core.h
      - name: Compile C and C++ header consumers
        if: runner.os == 'Linux'
        run: |
          cc native/fortuna-core/tests/header_smoke.c -L native/fortuna-core/target/release -lfortuna_core -o /tmp/fortuna-header-c
          c++ -x c++ native/fortuna-core/tests/header_smoke.c -L native/fortuna-core/target/release -lfortuna_core -o /tmp/fortuna-header-cpp
          LD_LIBRARY_PATH=native/fortuna-core/target/release /tmp/fortuna-header-c
          LD_LIBRARY_PATH=native/fortuna-core/target/release /tmp/fortuna-header-cpp
      - name: Upload native package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.library }}
            native/fortuna-core/include/fortuna_core.h
          if-no-files-found: error

# Dependency updates. Every pull request targets develop (the branch-policy workflow accepts
# dependabot/* heads into develop) and uses a lowercase Conventional Commits subject.
version: 2
updates:
  # NuGet packages (Directory.Packages.props) and the local tools in .config/dotnet-tools.json.
  - package-ecosystem: nuget
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /native/fortuna-core
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  # Workflow actions are pinned to commit SHAs; Dependabot updates the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']

  # Base images in the Dockerfile are pinned by digest.
  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: build

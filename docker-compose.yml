services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${API_IMAGE:-fortuna-api}:${API_IMAGE_TAG:-latest}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Every FORTUNA_* setting the API reads (FortunaOptions) is forwarded. A setting left empty
    # falls back to the API's own default, which is the value shown in docker/*.env.example.
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # Prefer a complete FORTUNA_DATA_CONNECTIONSTRING in the env file. When it is not set, the
      # connection string is still assembled from the DB_* variables as before (DB_USER and
      # DB_PASSWORD are then required).
      FORTUNA_DATA_CONNECTIONSTRING: "${FORTUNA_DATA_CONNECTIONSTRING:-Host=${DB_HOST:-host.docker.internal};Port=${DB_PORT:-5432};Database=${DB_NAME:-fortuna};Username=${DB_USER:?set FORTUNA_DATA_CONNECTIONSTRING or DB_USER in the env file};Password=${DB_PASSWORD:?set FORTUNA_DATA_CONNECTIONSTRING or DB_PASSWORD in the env file};Search Path=${DB_SEARCH_PATH:-fortuna};${DB_CONNECTION_EXTRA:-}}"
      FORTUNA_DATA_DATABASETYPE: PostgreSql
      FORTUNA_RUN_MIGRATIONS: ${FORTUNA_RUN_MIGRATIONS:-true}
      FORTUNA_STORAGE_PROVIDER: ${FORTUNA_STORAGE_PROVIDER:-Filesystem}
      FORTUNA_STORAGE_PATH: ${FORTUNA_STORAGE_PATH:-/app/attachments}
      FORTUNA_STORAGE_S3_ENDPOINT: ${FORTUNA_STORAGE_S3_ENDPOINT:-}
      FORTUNA_STORAGE_S3_BUCKET: ${FORTUNA_STORAGE_S3_BUCKET:-}
      FORTUNA_STORAGE_S3_ACCESS_KEY: ${FORTUNA_STORAGE_S3_ACCESS_KEY:-}
      FORTUNA_STORAGE_S3_SECRET_KEY: ${FORTUNA_STORAGE_S3_SECRET_KEY:-}
      FORTUNA_UPLOAD_MAX_BYTES: ${FORTUNA_UPLOAD_MAX_BYTES:-}
      FORTUNA_UPLOAD_ALLOWED_CONTENT_TYPES: ${FORTUNA_UPLOAD_ALLOWED_CONTENT_TYPES:-}
      FORTUNA_EXCEL_IMPORT_MAX_BYTES: ${FORTUNA_EXCEL_IMPORT_MAX_BYTES:-}
      FORTUNA_PDF_IMPORT_MAX_BYTES: ${FORTUNA_PDF_IMPORT_MAX_BYTES:-}
      FORTUNA_LOG_DIRECTORY: ${FORTUNA_LOG_DIRECTORY:-/app/logs}
      FORTUNA_JOB_QUEUE_CAPACITY: ${FORTUNA_JOB_QUEUE_CAPACITY:-256}
      FORTUNA_HEALTH_JOB_MAX_PENDING_SECONDS: ${FORTUNA_HEALTH_JOB_MAX_PENDING_SECONDS:-}
      FORTUNA_PAGE_SIZE_MAX: ${FORTUNA_PAGE_SIZE_MAX:-}
      FORTUNA_REPORT_MAX_RANGE_DAYS: ${FORTUNA_REPORT_MAX_RANGE_DAYS:-}
      FORTUNA_REPORT_KEY_TTL_MINUTES: ${FORTUNA_REPORT_KEY_TTL_MINUTES:-}
      FORTUNA_PROJECTION_MAX_HORIZON_DAYS: ${FORTUNA_PROJECTION_MAX_HORIZON_DAYS:-}
      FORTUNA_EXPORT_SYNC_THRESHOLD_ROWS: ${FORTUNA_EXPORT_SYNC_THRESHOLD_ROWS:-}
      FORTUNA_EXPORT_RETENTION_HOURS: ${FORTUNA_EXPORT_RETENTION_HOURS:-}
      FORTUNA_TRANSACTION_MAX_TAGS: ${FORTUNA_TRANSACTION_MAX_TAGS:-50}
      FORTUNA_AUTH_TOKEN_SECRET: ${FORTUNA_AUTH_TOKEN_SECRET:?set FORTUNA_AUTH_TOKEN_SECRET in the env file}
      FORTUNA_AUTH_TOKEN_SECRET_PREVIOUS: ${FORTUNA_AUTH_TOKEN_SECRET_PREVIOUS:-}
      FORTUNA_AUTH_TOKEN_ISSUER: ${FORTUNA_AUTH_TOKEN_ISSUER:?set FORTUNA_AUTH_TOKEN_ISSUER in the env file}
      FORTUNA_AUTH_TOKEN_AUDIENCE: ${FORTUNA_AUTH_TOKEN_AUDIENCE:?set FORTUNA_AUTH_TOKEN_AUDIENCE in the env file}
      FORTUNA_AUTH_TOKEN_EXPIRATION_IN_SECONDS: ${FORTUNA_AUTH_TOKEN_EXPIRATION_IN_SECONDS:-3600}
      FORTUNA_HEIMDALL_BASE_URL: ${FORTUNA_HEIMDALL_BASE_URL:?set FORTUNA_HEIMDALL_BASE_URL in the env file}
      FORTUNA_HEIMDALL_SCOPE_ID: ${FORTUNA_HEIMDALL_SCOPE_ID:?set FORTUNA_HEIMDALL_SCOPE_ID in the env file}
      FORTUNA_DEFAULT_DISPLAY_CURRENCY: ${FORTUNA_DEFAULT_DISPLAY_CURRENCY:-}
      FORTUNA_LOCALE: ${FORTUNA_LOCALE:?set FORTUNA_LOCALE in the env file}
      FORTUNA_LOCAL_AUTH_ENABLED: ${FORTUNA_LOCAL_AUTH_ENABLED:-false}
      FORTUNA_LOCAL_AUTH_RECOVERY_CODE_COUNT: ${FORTUNA_LOCAL_AUTH_RECOVERY_CODE_COUNT:-10}
      FORTUNA_CONSENT_EXTERNAL_PROCESSING_VERSION: ${FORTUNA_CONSENT_EXTERNAL_PROCESSING_VERSION:-}
      FORTUNA_PLUGGY_CLIENT_ID: ${FORTUNA_PLUGGY_CLIENT_ID:-}
      FORTUNA_PLUGGY_CLIENT_SECRET: ${FORTUNA_PLUGGY_CLIENT_SECRET:-}
      FORTUNA_PLUGGY_BASE_URL: ${FORTUNA_PLUGGY_BASE_URL:-}
      FORTUNA_RATES_SOURCE_BASE_URL: ${FORTUNA_RATES_SOURCE_BASE_URL:-}
      FORTUNA_RATES_SYNC_CRON: ${FORTUNA_RATES_SYNC_CRON:-}
      FORTUNA_RATES_CURRENCIES: ${FORTUNA_RATES_CURRENCIES:-}
      FORTUNA_RECONCILIATION_AMOUNT_TOLERANCE: ${FORTUNA_RECONCILIATION_AMOUNT_TOLERANCE:-0.01}
      FORTUNA_RECONCILIATION_DATE_TOLERANCE_DAYS: ${FORTUNA_RECONCILIATION_DATE_TOLERANCE_DAYS:-1}
      # The entrypoint opens the metrics listener on this port (default 9464; 0 disables it).
      FORTUNA_METRICS_PORT: ${FORTUNA_METRICS_PORT:-}
    volumes:
      - logs:/app/logs
      - attachments:/app/attachments
    # Only the API port is published. Prometheus reaches the metrics port (FORTUNA_METRICS_PORT,
    # 9464 by default) over a private Docker network, so it is intentionally never mapped to the host.
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  logs:
  attachments:

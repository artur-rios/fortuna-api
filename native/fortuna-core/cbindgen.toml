language = "C"
include_guard = "FORTUNA_CORE_H"
pragma_once = true
documentation = true
style = "both"
usize_is_size_t = true
cpp_compat = true
header = "/* Generated by cbindgen. Do not edit by hand. */"
autogen_warning = "/* Regenerate with: cargo build --manifest-path native/fortuna-core/Cargo.toml */"

[parse]
parse_deps = false

[export]
include = [
  "FORTUNA_STATUS_OK",
  "FORTUNA_STATUS_CREATED",
  "FORTUNA_STATUS_ACCEPTED",
  "FORTUNA_STATUS_BAD_REQUEST",
  "FORTUNA_STATUS_UNAUTHORIZED",
  "FORTUNA_STATUS_NOT_FOUND",
  "FORTUNA_STATUS_CONFLICT",
  "FORTUNA_STATUS_INTERNAL_ERROR",
  "FORTUNA_STATUS_NOT_INITIALIZED",
  "fortuna_initialize",
  "fortuna_shutdown",
  "fortuna_version",
  "fortuna_health",
  "fortuna_capabilities",
  "fortuna_api_local_accounts_authenticate",
  "fortuna_api_accounts_get_by_id",
  "fortuna_string_free",
]
